aid: healthcare-com
name: Healthcare.com
description: 'Healthcare.com (HealthCare, Inc.) is a privately held, non-government
  health insurance marketplace and distribution platform founded in 2014. Consumers
  use healthcare.com to find, compare and enroll in ACA/under-65 individual health
  plans, Medicare Advantage and Medicare Supplement plans, and specialty coverage;
  distributors, FMOs, MGAs and agents use its Autopilot machine-learning enrollment
  acquisition platform, which matches high-intent shoppers to distributor partners
  with predictive scoring and value-based lead pricing. Its Pivot Health subsidiary
  develops and markets proprietary short-term medical, fixed indemnity and supplemental
  gap products with A-rated carriers. Insurance is sold through Healthcare.com Insurance
  Services, LLC. As of this profiling pass the company publishes no public developer
  API, developer portal, OpenAPI definition or SDKs.'
