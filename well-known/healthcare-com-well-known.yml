source: live HTTP probes of every Healthcare.com host found in apis.yml
summary: >-
  No RFC 8615 well-known document is published on any Healthcare.com or Pivot Health
  host. The primary marketing host (www.healthcare.com) is a Next.js single-page app
  whose catch-all route answers HTTP 200 with the same ~42KB HTML shell for every
  unknown path — including every /.well-known/* path probed — so those 200s are soft
  404s, NOT documents. They are recorded here explicitly so a later pass does not
  mistake them for hits. The API host (api.healthcare.com) returns genuine plain-text
  404s and serves no discovery surface.
